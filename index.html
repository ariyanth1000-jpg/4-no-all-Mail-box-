<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Mail Links</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    min-height:100vh;
    padding:20px 10px;

    font-family:Arial,Helvetica,sans-serif;

    background:
        radial-gradient(
            circle at 10% 5%,
            rgba(255,255,255,.23),
            transparent 24%
        ),
        radial-gradient(
            circle at 90% 95%,
            rgba(255,255,255,.18),
            transparent 24%
        ),
        linear-gradient(
            145deg,
            #f000d8 0%,
            #a84aa7 35%,
            #55946f 68%,
            #00d51c 100%
        );

    overflow-x:hidden;
}


/* =========================
   GRID
========================= */

.mail-grid{
    width:100%;
    max-width:900px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:20px;
}


/* =========================
   CARD
========================= */

.mail-card{
    position:relative;

    height:195px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    border-radius:23px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.98),
            rgba(255,255,255,.84)
        );

    border:1px solid rgba(255,255,255,.95);

    box-shadow:
        0 9px 24px rgba(0,0,0,.17),
        inset 0 1px 0 rgba(255,255,255,1);

    overflow:hidden;

    transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        box-shadow .35s ease;
}


/* Animated Glow */

.mail-card::before{
    content:"";

    position:absolute;

    width:170px;
    height:170px;

    top:-100px;
    right:-80px;

    border-radius:50%;

    background:rgba(255,0,220,.15);

    filter:blur(12px);

    transition:.45s ease;
}

.mail-card:hover::before{
    transform:scale(2.1);
}


/* Animated Top Line */

.mail-card::after{
    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:4px;

    background:
        linear-gradient(
            90deg,
            #ff00d4,
            #6c5ce7,
            #00b894,
            #00d51c,
            #ff00d4
        );

    background-size:300% 100%;

    animation:topLine 4s linear infinite;
}

@keyframes topLine{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}


/* Hover */

.mail-card:hover{
    transform:translateY(-7px) scale(1.025);

    box-shadow:
        0 17px 35px rgba(0,0,0,.25),
        0 0 25px rgba(255,255,255,.28);
}

.mail-card:active{
    transform:scale(.95);
}


/* =========================
   CIRCLE LOGO
========================= */

.email-logo{
    position:relative;

    width:84px;
    height:84px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:41px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f1f1f1
        );

    border:5px solid transparent;

    box-shadow:
        0 7px 18px rgba(0,0,0,.18),
        inset 0 0 13px rgba(255,255,255,.95);

    margin-bottom:12px;

    animation:floating 3s ease-in-out infinite;

    transition:
        transform .35s ease,
        box-shadow .35s ease;
}


/* Rotating Ring */

.email-logo::before{
    content:"";

    position:absolute;

    inset:-5px;

    border-radius:50%;

    background:
        conic-gradient(
            #ff00d4,
            #6c5ce7,
            #00b894,
            #00d51c,
            #ff00d4
        );

    z-index:-1;

    animation:spin 4s linear infinite;
}


/* Inner Glow */

.email-logo::after{
    content:"";

    position:absolute;

    inset:5px;

    border-radius:50%;

    box-shadow:
        inset 0 0 15px rgba(255,255,255,.95);

    pointer-events:none;
}


@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}


@keyframes floating{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-4px);
    }
}


.mail-card:hover .email-logo{
    transform:scale(1.12) rotate(5deg);

    box-shadow:
        0 10px 28px rgba(0,0,0,.22),
        0 0 22px rgba(255,0,210,.28);
}


/* =========================
   NAME
========================= */

.mail-name{
    position:relative;

    color:#182b9e;

    font-size:19px;
    font-weight:800;

    letter-spacing:.3px;

    text-align:center;
}


/* Status Dot */

.mail-name::before{
    content:"";

    display:inline-block;

    width:6px;
    height:6px;

    margin-right:7px;

    vertical-align:middle;

    border-radius:50%;

    background:#00c853;

    box-shadow:
        0 0 8px #00c853;

    animation:pulse 1.5s infinite;
}


@keyframes pulse{

    0%,100%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(.55);
        opacity:.45;
    }
}


/* =========================
   TABLET
========================= */

@media(max-width:750px){

    body{
        padding:15px 8px;
    }

    .mail-grid{
        grid-template-columns:repeat(3,1fr);
        gap:13px;
    }

    .mail-card{
        height:165px;
        border-radius:19px;
    }

    .email-logo{
        width:68px;
        height:68px;

        font-size:33px;

        margin-bottom:9px;
    }

    .mail-name{
        font-size:15px;
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:520px){

    body{
        padding:12px 6px;
    }

    .mail-grid{
        grid-template-columns:repeat(3,1fr);
        gap:9px;
    }

    .mail-card{
        height:145px;

        padding:7px 2px;

        border-radius:15px;
    }

    .email-logo{
        width:55px;
        height:55px;

        font-size:27px;

        border-width:4px;

        margin-bottom:7px;
    }

    .mail-name{
        font-size:12px;
        letter-spacing:0;
    }

    .mail-name::before{
        width:4px;
        height:4px;

        margin-right:3px;
    }
}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:360px){

    body{
        padding:9px 5px;
    }

    .mail-grid{
        grid-template-columns:repeat(3,1fr);
        gap:7px;
    }

    .mail-card{
        height:130px;
        border-radius:13px;
    }

    .email-logo{
        width:47px;
        height:47px;

        font-size:23px;

        border-width:3px;

        margin-bottom:6px;
    }

    .mail-name{
        font-size:10.5px;
    }

    .mail-name::before{
        width:3px;
        height:3px;

        margin-right:2px;
    }
}

</style>
