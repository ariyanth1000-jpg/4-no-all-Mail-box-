<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mail Links</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    padding:18px 10px;

    font-family:Arial,sans-serif;

    background:linear-gradient(
        180deg,
        #e900d8 0%,
        #a94da8 35%,
        #5b9d70 65%,
        #00d51c 100%
    );
}

/* GRID */
.mail-grid{
    max-width:820px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px 35px;
}

/* CARD */
.mail-card{
    background:#fff;
    border-radius:15px;

    min-height:225px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:10px;

    text-decoration:none;

    box-shadow:0 4px 10px rgba(0,0,0,.18);

    transition:.25s ease;
}

.mail-card:hover{
    transform:translateY(-5px);
    box-shadow:0 9px 18px rgba(0,0,0,.25);
}


/* EMAIL LOGO */
.email-logo{
    width:135px;
    height:135px;

    border-radius:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:78px;

    background:linear-gradient(
        135deg,
        #4285f4,
        #34a853,
        #fbbc05,
        #ea4335
    );

    box-shadow:0 4px 10px rgba(0,0,0,.15);

    margin-bottom:9px;
}


/* MAIL NAME */
.mail-name{
    color:#092db8;

    font-size:23px;
    font-weight:700;

    text-align:center;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .mail-grid{
        grid-template-columns:repeat(2,1fr);
        gap:14px;
    }

    .mail-card{
        min-height:175px;
        border-radius:13px;
    }

    .email-logo{
        width:95px;
        height:95px;

        font-size:55px;

        border-radius:20px;

        margin-bottom:7px;
    }

    .mail-name{
        font-size:18px;
    }
}


/* SMALL MOBILE */
@media(max-width:400px){

    body{
        padding:12px 7px;
    }

    .mail-grid{
        gap:11px;
    }

    .mail-card{
        min-height:160px;
    }

    .email-logo{
        width:82px;
        height:82px;

        font-size:47px;

        border-radius:17px;
    }

    .mail-name{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="mail-grid">

    <!-- Mail 1 -->
    <a class="mail-card"
       href="https://tmaily.com/"
       target="_blank">
        <div class="email-logo">📧</div>
        <div class="mail-name">Mail 1</div>
    </a>


    <!-- Mail 2 -->
    <a class="mail-card"
       href="https://generator.email/?utm_source=chatgpt.com"
       target="_blank">
        <div class="email-logo">✉️</div>
        <div class="mail-name">Mail 2</div>
    </a>


    <!-- Mail 3 -->
    <a class="mail-card"
       href="https://www.disposablemail.com/?utm_source=chatgpt.com"
       target="_blank">
        <div class="email-logo">📩</div>
        <div class="mail-name">Mail 3</div>
    </a>


    <!-- Mail 4 -->
    <a class="mail-card"
       href="https://inboxes.com/"
       target="_blank">
        <div class="email-logo">💌</div>
        <div class="mail-name">Mail 4</div>
    </a>


    <!-- Mail 5 -->
    <a class="mail-card"
       href="https://tempail.com/en/"
       target="_blank">
        <div class="email-logo">📬</div>
        <div class="mail-name">Mail 5</div>
    </a>


    <!-- Mail 6 -->
    <a class="mail-card"
       href="https://temp-mail.asia/"
       target="_blank">
        <div class="email-logo">📧</div>
        <div class="mail-name">Mail 6</div>
    </a>


    <!-- Mail 7 -->
    <a class="mail-card"
       href="https://anu-mail-site.vercel.app/"
       target="_blank">
        <div class="email-logo">✉️</div>
        <div class="mail-name">Mail 7</div>
    </a>


    <!-- Mail 8 -->
    <a class="mail-card"
       href="https://tempmail.ninja/"
       target="_blank">
        <div class="email-logo">📩</div>
        <div class="mail-name">Mail 8</div>
    </a>


    <!-- Mail 9 -->
    <a class="mail-card"
       href="https://www.emailondeck.com/"
       target="_blank">
        <div class="email-logo">💌</div>
        <div class="mail-name">Mail 9</div>
    </a>


    <!-- Mail 10 -->
    <a class="mail-card"
       href="https://ariyanth1000-jpg.github.io/Tamim-mail-laptop-use//"

        <div class="mail-name">Mail 10</div>

</div>

</body>
</html>
